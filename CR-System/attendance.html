    <script type="text/javascript">
      
      //for attendance page logic

let masterRoster = [];

        async function initPage() {
            try {
                // Read and un-scramble the core class roster database list array
                const response = await fetch('/class-list.enc');
                const encryptedData = await response.text();
                masterRoster = JSON.parse(atob(encryptedData.trim()));
                renderAttendanceLayout();
            } catch (e) {
                console.error("Critical roster synchronization failure mapping.");
            }
        }

        function renderAttendanceLayout() {
            const container = document.getElementById('attendanceContainer');
            const db = loadAdminMatrix();
            container.innerHTML = "";

            if (!db.attendance || db.attendance.length === 0) {
                container.innerHTML = `<div class='metric-card'>[!] NO ACTIVE ATTENDANCE MATRIX CATEGORIES INITIALIZED</div>`;
                return;
            }

            db.attendance.forEach(task => {
                const metrics = computeTaskMetrics(task.students.length);
                
                const block = document.createElement('div');
                block.className = 'task-block';
                block.innerHTML = `
                    <div class="task-header">
                        <div>
                            <strong style="font-size:1.1rem; color:#fff;">${task.title.toUpperCase()}</strong><br>
                            <small style="color:#00d4ff;"><i class="fa fa-calendar"></i> Init Date: ${task.date}</small>
                        </div>
                        <div class="no-print" style="display:flex; gap:10px;">
                            <button class="btn-action" style="padding:6px 12px; font-size:0.8rem; background:#118ab2;" onclick="copyListToClipboard('${task.title}', 'Present', ${JSON.stringify(task.students)}, ${JSON.stringify(masterRoster)})"><i class="fa fa-whatsapp"></i> COPY WHATSAPP</button>
                            <button class="btn-action" style="padding:6px 12px; font-size:0.8rem; background:#06d6a0;" onclick="window.print()"><i class="fa fa-print"></i> EXPORT REPORT</button>
                        </div>
                    </div>
                    
                    <!-- Dynamic Dashboard KPI Metrics Bar Layout -->
                    <div class="metrics-bar" style="padding:15px; background:#050b14; border-bottom:1px solid #1c2541;">
                        <div class="metric-card">🟢 PRESENT: <strong style="color:#06d6a0;">${metrics.completed}</strong></div>
                        <div class="metric-card">🔴 ABSENT: <strong style="color:#800020;">${metrics.pending}</strong></div>
                        <div class="metric-card">🧑‍💻 MATRIX LIST BASE: <strong>${metrics.totalClass}</strong></div>
                    </div>

                    <!-- Live Searching Mechanics Wrapper Panel Block -->
                    <div class="no-print" style="padding:15px; background:rgba(255,255,255,0.01); border-bottom:1px solid #1c2541;">
                        <input type="text" class="input-box" placeholder="🔎 Search Name or Registration Number to Toggle Attendance..." oninput="filterAttendanceSearch(this, '${task.id}')">
                        <div class="search-output-bin" id="searchBin_${task.id}" style="margin-top:10px; max-height:200px; overflow-y:auto;"></div>
                    </div>

                    <!-- Verified Attended Database Table Layout Block Rendering Row UI -->
                    <div style="padding:10px; font-weight:bold; color:#00d4ff; background:#050b14;" class="no-print">CURRENT ATTENDANCE LIST ROOT:</div>
                    <div id="list_${task.id}" style="max-height:300px; overflow-y:auto;">
                        ${renderActiveAttendedRows(task.id, task.students)}
                    </div>
                `;
                container.appendChild(block);
            });
        }

        function renderActiveAttendedRows(taskId, studentArray) {
            if (studentArray.length === 0) return `<div style="padding:15px; color:#cbd5e1; text-align:center;">No students checked into this terminal log yet.</div>`;
            return studentArray.map(reg => {
                const match = masterRoster.find(s => s.regNumber === reg);
                return `
                    <div class="student-row">
                        <span>🏷️ ${match ? match.name.toUpperCase() : "UNKNOWN NODE"} (${reg})</span>
                        <button class="btn-action no-print" style="background:#4a0e17; padding:4px 10px; font-size:0.75rem; color:#fff; margin:5px;z" onclick="processToggle('${taskId}', '${reg}')">REMOVE</button>
                    </div>
                `;
            }).join('');
        }

        function filterAttendanceSearch(inputEl, taskId) {
            const query = inputEl.value.trim().toLowerCase();
            const bin = document.getElementById(`searchBin_${taskId}`);
            bin.innerHTML = "";
            if (query.length < 2) return;

            const matches = masterRoster.filter(s => s.name.toLowerCase().includes(query) || s.regNumber.includes(query)).slice(0, 5);
            
            matches.forEach(student => {
                const row = document.createElement('div');
                row.className = 'student-row';
                row.style.background = '#050b14';
                row.innerHTML = `
                    <span>${student.name.toUpperCase()} (${student.regNumber})</span>
                    <button class="btn-action" style="padding:5px 10px; font-size:0.8rem; background:#06d6a0; color:#fff; border-radius:15px; margin:5px;" onclick="processToggle('${taskId}', '${student.regNumber}'); document.getElementById('searchBin_${taskId}').innerHTML='';" >ADD</button>
                `;
                bin.appendChild(row);
            });
        }

        function processToggle(taskId, regNum) {
            toggleStudentInTask('attendance', taskId, regNum);
            renderAttendanceLayout();
        }

        document.addEventListener('DOMContentLoaded', initPage);
        
  
    </script>
