<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYB CRUISE | Admin Gate</title>
    <link rel="stylesheet" href="/style.css">
    
   
</head>
<body style="background:#050b14; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0;">

    <div class="features-list" style="max-width:400px; text-align:center; border-color:#800020;">
        
        <img src="/Images/cyb-cruise-group-logo-1.png.png" alt="CRUISE GROUP Logo" class="nav-logo" width="250" height="250" id="loginLogo">
        
        
        <h3 style="color:#ffffff; font-family:monospace;">🔑 ADMIN PRIVILEGE CHALLENGE</h3>
        <p style="color:#cbd5e1; font-size:0.85rem; font-family:monospace;">ENTER LEVEL-2 SECTOR PASSPHRASE</p>
        
        <input type="password" id="passphraseInput" placeholder="••••••••••••" style="width:100%; padding:12px; background:#050b14; border:1px solid #1c2541; color:#fff; border-radius:8px; margin:20px 0; text-align:center; font-family:monospace;">
        
        <button id="authAdminBtn" class="btn" style="background:#800020; width:100%; border-radius:8px; padding:12px; font-family:monospace; color:#fff;">VALIDATE VECTOR</button>
        <div id="gateStatus" style="margin-top:15px; color:#00d4ff; font-family:monospace; font-size:0.75rem;"></div>
    </div>

    
    <script>
    document.getElementById('authAdminBtn').addEventListener('click', async () => {
        const input = document.getElementById('passphraseInput').value;
        const status = document.getElementById('gateStatus');

        status.textContent = "Validating with server...";

        // Send the raw password to the server for verification
        // The server will compare this against your env variable
        const response = await fetch('http://localhost:5500/api/admin/login' || 'http://localhost:6700/api/admin/login', {
            method: 'POST',
        headers: {'Content-Type': 'application/json' },
        body: JSON.stringify({password: input })
        });

        if (response.ok) {
            const data = await response.json();
        status.style.color = "#00d4ff";
        status.textContent = "Access Verified. Routing...";

        // Store the token returned by the server
        localStorage.setItem('x-admin-token', data.token);
            
            setTimeout(() => {
            window.location.href = 'admin-dashboard.html'; 
            }, 600);
        } else {
            status.style.color = "#800020";
        status.textContent = "INVALID PASSPHRASE. AUTHENTICATION FAILURE.";
        }
    });
</script>

    
    
   <script src="/auth.js"></script>
    
    <script src="admin-guard.js
    "></script>
</body>
</html>
